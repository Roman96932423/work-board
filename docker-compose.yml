services:
  web:
    build: .
    container_name: work_board

    command: >
      sh -c "
      sleep 5 &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: workb_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: workb_db
      POSTGRES_USER: workb_user
      POSTGRES_PASSWORD: workb_password

    ports:
      - "5432:5432"

volumes:
  postgres_data: